<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pastryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EDE6DC" />
    </linearGradient>
    <linearGradient id="croissantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#D97736" />
      <stop offset="100%" stop-color="#8C4A1A" />
    </linearGradient>
    <linearGradient id="crustGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#pastryBg)" rx="16" />
  <circle cx="200" cy="150" r="100" fill="#3B2219" opacity="0.06" />

  <!-- Wooden plate / Board -->
  <ellipse cx="200" cy="225" rx="130" ry="24" fill="#D5CBC0" />
  <ellipse cx="200" cy="220" rx="120" ry="20" fill="#E8E0D5" />

  <!-- Croissant body layers -->
  <!-- Back / Tips -->
  <path d="M100 190 Q90 150 140 140 Q110 170 120 200 Z" fill="#9A501E" />
  <path d="M300 190 Q310 150 260 140 Q290 170 280 200 Z" fill="#9A501E" />

  <!-- Outer curved crescents -->
  <path d="M120 185 C115 145 155 125 180 125 C160 145 150 175 140 195 Z" fill="url(#croissantGrad)" />
  <path d="M280 185 C285 145 245 125 220 125 C240 145 250 175 260 195 Z" fill="url(#croissantGrad)" />

  <!-- Center puffy rolls -->
  <path d="M150 180 C145 130 180 110 200 110 C185 135 180 170 170 195 Z" fill="url(#crustGlow)" />
  <path d="M250 180 C255 130 220 110 200 110 C215 135 220 170 230 195 Z" fill="url(#crustGlow)" />
  
  <!-- Main plump center dome -->
  <path d="M170 190 C170 120 230 120 230 190 C210 205 190 205 170 190 Z" fill="url(#croissantGrad)" />

  <!-- Flaky crust ridges / cuts -->
  <path d="M180 135 Q200 145 220 135" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M175 155 Q200 168 225 155" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M178 175 Q200 185 222 175" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Butter glaze shine -->
  <ellipse cx="200" cy="145" rx="14" ry="5" fill="#FFFFFF" opacity="0.4" transform="rotate(-10 200 145)" />

  <!-- Crumbs -->
  <circle cx="115" cy="225" r="2.5" fill="#B45309" />
  <circle cx="130" cy="232" r="3.5" fill="#D97736" />
  <circle cx="270" cy="228" r="3" fill="#D97736" />
  <circle cx="285" cy="222" r="2" fill="#B45309" />
  <circle cx="200" cy="228" r="2.5" fill="#9A501E" />
</svg>
